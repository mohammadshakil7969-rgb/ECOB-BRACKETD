<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ECOB BRACKET</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial, sans-serif;
    background:#08090d;
    color:#fff;
    padding:20px;
}

.container{
    max-width:1400px;
    margin:auto;
}

.header{
    text-align:center;
    margin-bottom:25px;
}

.header h1{
    font-size:34px;
    font-weight:900;
    letter-spacing:2px;
}

.header p{
    color:#8d8d96;
    margin-top:7px;
}

.card{
    background:#12141a;
    border:1px solid #292c35;
    border-radius:14px;
    padding:20px;
    margin-bottom:20px;
}

label{
    display:block;
    font-weight:700;
    margin-bottom:8px;
}

select,
input{
    width:100%;
    height:45px;
    background:#090a0e;
    border:1px solid #30333d;
    border-radius:7px;
    color:#fff;
    padding:0 12px;
    outline:none;
}

select:focus,
input:focus{
    border-color:#fff;
}

.team-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:10px;
    margin-top:18px;
}

button{
    border:0;
    border-radius:8px;
    height:48px;
    font-size:14px;
    font-weight:800;
    cursor:pointer;
}

.generate{
    width:100%;
    background:#fff;
    color:#000;
    margin-top:20px;
}

#bracketArea{
    display:none;
}

.bracket-header{
    text-align:center;
    margin-bottom:20px;
}

.bracket-header h2{
    font-size:25px;
}

.bracket-header p{
    color:#888;
    margin-top:5px;
}

.bracket-wrapper{
    overflow-x:auto;
    background:#090a0e;
    border:1px solid #292c35;
    border-radius:12px;
    padding:35px 25px;
}

.bracket{
    min-width:1050px;
    display:grid;
    grid-template-columns:1fr 1fr 170px 1fr 1fr;
    gap:25px;
    align-items:stretch;
}

.bracket-side{
    display:flex;
    flex-direction:column;
    justify-content:space-around;
}

.round{
    display:flex;
    flex-direction:column;
    justify-content:space-around;
    min-width:170px;
}

.round-title{
    text-align:center;
    color:#aaa;
    font-size:12px;
    font-weight:800;
    letter-spacing:1px;
    margin-bottom:10px;
}

.matches{
    height:100%;
    display:flex;
    flex-direction:column;
    justify-content:space-around;
    gap:15px;
}

.match{
    position:relative;
}

.team{
    height:38px;
    background:#171a21;
    border:1px solid #343843;
    display:flex;
    align-items:center;
    padding:0 10px;
    font-size:13px;
    font-weight:700;
    border-radius:5px;
    overflow:hidden;
    white-space:nowrap;
    text-overflow:ellipsis;
}

.team:first-child{
    margin-bottom:3px;
}

.placeholder{
    color:#6e717a;
    font-weight:500;
}

.left .match::after{
    content:"";
    position:absolute;
    right:-25px;
    top:50%;
    width:25px;
    height:1px;
    background:#555;
}

.right .match::before{
    content:"";
    position:absolute;
    left:-25px;
    top:50%;
    width:25px;
    height:1px;
    background:#555;
}

.final-column{
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    min-width:170px;
}

.final-title{
    color:#fff;
    font-size:13px;
    font-weight:900;
    letter-spacing:2px;
    margin-bottom:15px;
}

.final-box{
    width:160px;
    border:2px solid #fff;
    border-radius:8px;
    overflow:hidden;
}

.final-team{
    height:45px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#171a21;
    font-weight:800;
    font-size:13px;
    padding:5px;
    text-align:center;
}

.final-team:first-child{
    border-bottom:1px solid #555;
}

.champion{
    margin-top:20px;
    text-align:center;
    color:#aaa;
    font-size:11px;
    letter-spacing:1px;
}

.actions{
    display:flex;
    gap:10px;
    margin-top:20px;
}

.actions button{
    flex:1;
}

.save{
    background:#18bd72;
    color:#fff;
}

.reset{
    background:#292c35;
    color:#fff;
}

@media(max-width:700px){

    body{
        padding:10px;
    }

    .header h1{
        font-size:27px;
    }

    .team-grid{
        grid-template-columns:1fr;
    }

    .bracket-wrapper{
        padding:25px 15px;
    }
}
</style>
</head>

<body>

<div class="container">

    <div class="header">
        <h1>ECOB BRACKET</h1>
        <p>Knockout Tournament Generator</p>
    </div>

    <div class="card">

        <label>SELECT ROUND</label>

        <select id="roundSelect" onchange="createInputs()">
            <option value="8">8 TEAMS</option>
            <option value="16">16 TEAMS</option>
            <option value="32" selected>32 TEAMS</option>
        </select>

        <div id="teamInputs" class="team-grid"></div>

        <button class="generate" onclick="generateBracket()">
            GENERATE BRACKET
        </button>

    </div>


    <div id="bracketArea">

        <div class="card">

            <div class="bracket-header">
                <h2>ECOB BRACKET</h2>
                <p id="bracketRound"></p>
            </div>

            <div class="bracket-wrapper">

                <div class="bracket">

                    <!-- LEFT SIDE -->

                    <div class="bracket-side left" id="leftR1"></div>

                    <div class="bracket-side left" id="leftR2"></div>

                    <div class="bracket-side left" id="leftR3"></div>


                    <!-- FINAL -->

                    <div class="final-column">

                        <div class="final-title">
                            FINAL
                        </div>

                        <div class="final-box">

                            <div class="final-team placeholder">
                                Winner SF 1
                            </div>

                            <div class="final-team placeholder">
                                Winner SF 2
                            </div>

                        </div>

                        <div class="champion">
                            CHAMPION
                        </div>

                    </div>


                    <!-- RIGHT SIDE -->

                    <div class="bracket-side right" id="rightRounds"></div>

                </div>

            </div>

            <div class="actions">

                <button class="save" onclick="saveImage()">
                    SAVE BRACKET IMAGE
                </button>

                <button class="reset" onclick="resetAll()">
                    RESET
                </button>

            </div>

        </div>

    </div>

</div>


<script>

let teamCount = 32;
let teams = [];


/* =========================
   CREATE TEAM INPUTS
========================= */

function createInputs(){

    teamCount =
        Number(document.getElementById("roundSelect").value);

    const box =
        document.getElementById("teamInputs");

    box.innerHTML = "";

    for(let i=1;i<=teamCount;i++){

        const input =
            document.createElement("input");

        input.type = "text";
        input.id = "team" + i;
        input.placeholder = "Team " + i;

        box.appendChild(input);
    }

    loadSaved();

}


/* =========================
   GENERATE
========================= */

function generateBracket(){

    teams = [];

    for(let i=1;i<=teamCount;i++){

        const input =
            document.getElementById("team"+i);

        let name =
            input.value.trim();

        if(name === ""){
            name = "Team " + i;
        }

        teams.push(name);
    }

    saveData();

    drawBracket();

    document.getElementById(
        "bracketArea"
    ).style.display = "block";

    document.getElementById(
        "bracketArea"
    ).scrollIntoView({
        behavior:"smooth"
    });

}


/* =========================
   DRAW BRACKET
========================= */

function drawBracket(){

    document.getElementById("leftR1").innerHTML = "";
    document.getElementById("leftR2").innerHTML = "";
    document.getElementById("leftR3").innerHTML = "";

    document.getElementById("rightRounds").innerHTML = "";

    document.getElementById(
        "bracketRound"
    ).textContent =
        teamCount + " TEAM KNOCKOUT";


    /*
       8 TEAM
       QF -> SF -> FINAL
    */

    if(teamCount === 8){

        createMatches(
            document.getElementById("leftR1"),
            teams.slice(0,4)
        );

        createMatches(
            document.getElementById("leftR2"),
            [
                "Winner QF 1",
                "Winner QF 2"
            ],
            true
        );

        createMatches(
            document.getElementById("rightRounds"),
            [
                "Winner QF 4",
                "Winner QF 3"
            ],
            true
        );

        return;
    }


    /*
       16 TEAM
       R16 -> QF -> SF -> FINAL
    */

    if(teamCount === 16){

        createMatches(
            document.getElementById("leftR1"),
            teams.slice(0,8)
        );

        createMatches(
            document.getElementById("leftR2"),
            [
                "Winner R16 1",
                "Winner R16 2",
                "Winner R16 3",
                "Winner R16 4"
            ],
            true
        );

        createMatches(
            document.getElementById("leftR3"),
            [
                "Winner QF 1",
                "Winner QF 2"
            ],
            true
        );


        createMatches(
            document.getElementById("rightRounds"),
            [
                "Winner QF 4",
                "Winner QF 3",
                "Winner R16 8",
                "Winner R16 7",
                "Winner R16 6",
                "Winner R16 5"
            ],
            true
        );

        return;
    }


    /*
       32 TEAM
       R32 -> R16 -> QF -> SF -> FINAL
    */

    if(teamCount === 32){

        /*
          Left 16 teams
        */

        createMatches(
            document.getElementById("leftR1"),
            teams.slice(0,16)
        );

        /*
          Right 16 teams
        */

        createMatches(
            document.getElementById("rightRounds"),
            teams.slice(16,32).reverse()
        );

        /*
          Extra rounds are represented
          in the middle-left/right structure.
        */

        document.getElementById(
            "leftR2"
        ).innerHTML = roundMatches(
            "ROUND OF 16",
            8,
            "Winner R32"
        );

        document.getElementById(
            "leftR3"
        ).innerHTML = roundMatches(
            "QUARTER FINAL",
            4,
            "Winner R16"
        );

    }

}


/* =========================
   MATCH CREATOR
========================= */

function createMatches(container,names,placeholder=false){

    container.innerHTML = "";

    for(let i=0;i<names.length;i+=2){

        const match =
            document.createElement("div");

        match.className = "match";

        const t1 =
            document.createElement("div");

        const t2 =
            document.createElement("div");

        t1.className =
            "team " +
            (placeholder ? "placeholder" : "");

        t2.className =
            "team " +
            (placeholder ? "placeholder" : "");

        t1.textContent =
            names[i] || "TBD";

        t2.textContent =
            names[i+1] || "TBD";

        match.appendChild(t1);
        match.appendChild(t2);

        container.appendChild(match);
    }

}


/* =========================
   ROUND MATCHES
========================= */

function roundMatches(title,count,prefix){

    let html =
        '<div class="round-title">'+
        title+
        '</div>';

    html += '<div class="matches">';

    for(let i=1;i<=count;i++){

        html += `
            <div class="match">
                <div class="team placeholder">
                    ${prefix} ${i}
                </div>
                <div class="team placeholder">
                    ${prefix} ${i}
                </div>
            </div>
        `;

    }

    html += "</div>";

    return html;
}


/* =========================
   SAVE DATA
========================= */

function saveData(){

    localStorage.setItem(
        "ECOB_ROUND",
        teamCount
    );

    localStorage.setItem(
        "ECOB_TEAMS",
        JSON.stringify(teams)
    );

}


/* =========================
   LOAD DATA
========================= */

function loadSaved(){

    const saved =
        localStorage.getItem("ECOB_TEAMS");

    if(!saved) return;

    try{

        const data =
            JSON.parse(saved);

        data.forEach((name,index)=>{

            const input =
                document.getElementById(
                    "team"+(index+1)
                );

            if(input){
                input.value = name;
            }

        });

    }catch(e){}

}


/* =========================
   RESET
========================= */

function resetAll(){

    if(!confirm(
        "Reset ECOB BRACKET?"
    )){
        return;
    }

    localStorage.removeItem("ECOB_ROUND");
    localStorage.removeItem("ECOB_TEAMS");

    document.getElementById(
        "bracketArea"
    ).style.display = "none";

    createInputs();

}


/* =========================
   SAVE IMAGE
========================= */

async function saveImage(){

    const bracket =
        document.querySelector(
            ".bracket-wrapper"
        );

    if(typeof html2canvas === "undefined"){

        alert(
            "Please wait and try again."
        );

        return;
    }

    try{

        const canvas =
            await html2canvas(
                bracket,
                {
                    backgroundColor:"#090a0e",
                    scale:2
                }
            );

        const link =
            document.createElement("a");

        link.download =
            "ECOB-BRACKET.png";

        link.href =
            canvas.toDataURL("image/png");

        link.click();

    }catch(error){

        alert(
            "Unable to save image."
        );

        console.log(error);

    }

}


/* =========================
   START
========================= */

window.onload = function(){

    const savedRound =
        localStorage.getItem("ECOB_ROUND");

    if(savedRound){

        teamCount =
            Number(savedRound);

        document.getElementById(
            "roundSelect"
        ).value =
            teamCount;

    }

    createInputs();

};

</script>


<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

</body>
</html>
